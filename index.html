<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Friends Spin Wheel</title>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --bg: #0f172a;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Login / Name Entry Screen */
        #login-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            transition: opacity 0.5s ease;
        }

        /* Welcome Animation */
        #welcome-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .welcome-text {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(to right, #818cf8, #fb7185);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        /* UI Elements */
        input {
            padding: 12px 20px;
            font-size: 1.1rem;
            border-radius: 8px;
            border: 2px solid var(--primary);
            background: #1e293b;
            color: white;
            margin-bottom: 15px;
            outline: none;
        }

        button {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { transform: scale(1.05); }

        /* Wheel Styles */
        #main-content { opacity: 0; transition: 1s; text-align: center; }
        
        #wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 20px auto;
        }

        canvas { border-radius: 50%; border: 5px solid #334155; }

        #pointer {
            position: absolute;
            top: -10px; left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0; 
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #f43f5e;
            z-index: 10;
        }

        #results {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            width: 280px;
            text-align: left;
        }

        .share-btn { background: #25d366; display: none; margin-top: 15px; width: 100%; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2 style="margin-bottom: 20px;">Who is playing?</h2>
        <input type="text" id="userName" placeholder="Enter Sahaj, Jeet, or Mayur">
        <button onclick="checkName()">Enter Game</button>
    </div>

    <div id="welcome-screen">
        <div class="welcome-text" id="welcomeMsg"></div>
        <p>Your wheel is ready...</p>
    </div>

    <div id="main-content">
        <h2 id="status">Ready to Spin?</h2>
        <div id="wheel-container">
            <div id="pointer"></div>
            <canvas id="wheel" width="320" height="320"></canvas>
        </div>
        <button id="spinBtn" onclick="spin()">SPIN NOW</button>

        <div id="results">
            <h4 style="margin:0 0 10px 0; color: #94a3b8;">Session Leaderboard:</h4>
            <div id="list">
                <p>Sahaj: -</p>
                <p>Jeet: -</p>
                <p>Mayur: -</p>
            </div>
            <button id="whatsappBtn" class="share-btn" onclick="sendWhatsApp()">Send Results to WhatsApp 📱</button>
        </div>
    </div>

    <script>
        const validNames = ["sahaj", "jeet", "mayur"];
        const options = ["Pay for Coffee ☕", "Do 5 Pushups 💪", "Truth or Dare 🎲", "Free Pass 🌟", "Tell a Joke 😂", "Buy Snacks 🍿"];
        const colors = ["#6366f1", "#8b5cf6", "#ec4899", "#f43f5e", "#f59e0b", "#10b981"];
        
        let currentUser = "";
        let resultsData = JSON.parse(localStorage.getItem('wheelResults')) || {};

        function checkName() {
            const input = document.getElementById("userName").value.toLowerCase().trim();
            if (validNames.includes(input)) {
                currentUser = input.charAt(0).toUpperCase() + input.slice(1);
                showWelcome();
            } else {
                alert("Please enter a valid name: Sahaj, Jeet, or Mayur");
            }
        }

        function showWelcome() {
            document.getElementById("login-screen").style.display = "none";
            const welcome = document.getElementById("welcome-screen");
            welcome.style.display = "flex";
            document.getElementById("welcomeMsg").innerText = "Welcome, " + currentUser + "!";
            
            setTimeout(() => {
                welcome.style.opacity = "0";
                setTimeout(() => {
                    welcome.style.display = "none";
                    document.getElementById("main-content").style.opacity = "1";
                    updateListUI();
                }, 500);
            }, 2000);
        }

        // --- WHEEL LOGIC ---
        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        let startAngle = 0;
        const arc = Math.PI / (options.length / 2);

        function drawWheel() {
            options.forEach((text, i) => {
                const angle = startAngle + i * arc;
                ctx.fillStyle = colors[i % colors.length];
                ctx.beginPath();
                ctx.moveTo(160, 160);
                ctx.arc(160, 160, 155, angle, angle + arc, false);
                ctx.lineTo(160, 160);
                ctx.fill();
                ctx.save();
                ctx.fillStyle = "white";
                ctx.translate(160 + Math.cos(angle + arc / 2) * 100, 160 + Math.sin(angle + arc / 2) * 100);
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                ctx.font = "bold 12px sans-serif";
                ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
                ctx.restore();
            });
        }

        function spin() {
            if (resultsData[currentUser]) {
                alert("You already had your turn, " + currentUser + "!");
                return;
            }
            document.getElementById("spinBtn").disabled = true;
            let spinAngleStart = Math.random() * 10 + 10;
            let spinTimeTotal = Math.random() * 3 + 3000;
            let spinTime = 0;

            function rotate() {
                spinTime += 30;
                if (spinTime >= spinTimeTotal) {
                    const degrees = startAngle * 180 / Math.PI + 90;
                    const index = Math.floor((360 - degrees % 360) / (arc * 180 / Math.PI));
                    resultsData[currentUser] = options[index];
                    localStorage.setItem('wheelResults', JSON.stringify(resultsData));
                    updateListUI();
                    return;
                }
                const spinAngle = spinAngleStart - (spinTime / spinTimeTotal * spinAngleStart);
                startAngle += (spinAngle * Math.PI / 180);
                drawWheel();
                requestAnimationFrame(rotate);
            }
            rotate();
        }

        function updateListUI() {
            const listDiv = document.getElementById("list");
            const names = ["Sahaj", "Jeet", "Mayur"];
            listDiv.innerHTML = names.map(n => `<p>${n}: <b>${resultsData[n] || 'Waiting...'}</b></p>`).join("");
            
            // If all 3 finished
            if (Object.keys(resultsData).length >= 3) {
                document.getElementById("whatsappBtn").style.display = "block";
                document.getElementById("spinBtn").style.display = "none";
            }
        }

        function sendWhatsApp() {
            let msg = "🚀 *Our Results* 🚀%0A%0A";
            for (let name in resultsData) {
                msg += `*${name}*: ${resultsData[name]}%0A`;
            }
            window.open(`https://wa.me/?text=${msg}`, '_blank');
        }

        drawWheel();
    </script>
</body>
</html>
